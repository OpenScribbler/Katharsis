name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run every suite under tests/
        run: bash tests/run-tests.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the scripts and the test suites
        run: shellcheck -S warning scripts/*.sh tests/*.sh

  validate:
    name: Plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned: 2.1.323 type-checks every .ts and .tsx file in the plugin,
      # hooks, tests and cli/ included, without the repo's tsconfig, and fails
      # --strict on code 2.1.322 accepts. Unpin when #187 is closed. AGENTS.md
      # repeats this version, and CONTRIBUTING.md points here.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.322

      # --strict fails on warnings, which is what the community marketplace
      # review pipeline runs against a submission.
      - name: Validate the marketplace, the plugin manifest, and the skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills

      # The hooks module's suites, tests/*.test.ts and *.test.tsx, among them
      # tests/events.test.ts, which fails on a hook on an event an
      # organization-managed account skips.
      - name: Run the hooks module's tests
        run: claude plugin test .

      # Fails when plugin.json and the marketplace entry disagree on the
      # version. --force skips the tag-already-exists check, which would
      # otherwise fail every run after a release until the next bump.
      - name: Check the two manifests agree on the version
        run: claude plugin tag --dry-run --force .
