name: Bug report
description: A hook, a script, the setup skill, or the style does something other than what the README or the guidance says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you saw and what you expected. Ideas about the cause are welcome, and no code is required.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Katharsis?
      options:
        - Classification (the wrong exchange type, or none)
        - A reply's shape under a type (styles/<type>.md)
        - Reference codes or the question round
        - The routing script (scripts/katharsis-exchange-style.sh)
        - The per-turn reminder (scripts/turn-reminder.sh)
        - The ledger or kref (scripts/ledger-stop.sh, scripts/kref.sh)
        - The classification gate or telemetry (scripts/stop-classify.sh)
        - Session start or the symlink (scripts/session-link.sh)
        - Setup (/katharsis:setup, scripts/setup.sh)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Paste the exact output where you have it. For a reply that came out wrong, paste the message you sent and the reply, and say which exchange type you expected.
      placeholder: "When I sent ... the reply ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "I expected ..."
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How did you get there?
      description: The steps or conditions that led to it. Say which of the two styles is active and whether you installed from the marketplace or with --plugin-dir.
      placeholder: |
        1. I installed with ...
        2. Then I sent ...
        3. That's when ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Katharsis and Claude Code versions
      description: The version field in .claude-plugin/plugin.json, and the output of `claude --version`.
      placeholder: "katharsis 0.3.0, Claude Code 2.1.260"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: For a hook problem, the matching lines from ~/.claude/katharsis-data/telemetry/gate-misses.jsonl or the session's ledger file. The telemetry holds no message text; a ledger row holds the coded line it recorded, so trim any you would rather not post.
    validations:
      required: false
