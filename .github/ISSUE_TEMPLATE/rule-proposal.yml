name: Rule proposal
description: A failure mode your transcripts show that the eleven rules do not name
labels: ["rule-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        A rule needs a measured pattern behind it. The audit skill gates a proposal on how many distinct surface forms the pattern takes, and this template asks for the same evidence, so a proposal arrives in the shape the rule set already uses.

  - type: textarea
    id: the-rule
    attributes:
      label: The rule
      description: One or two sentences, in the form the existing rules use. Say what to write, and never only what to avoid.
      placeholder: "Put the number in the sentence. The count is already in the tool output, so spend it."
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: What it costs the reader
      description: What a message that breaks this rule makes you do that a message following it would not.
      placeholder: "I have to re-read the paragraph to find the count the tool already printed."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The count and the corpus size, from `scripts/detect-prose.sh` or a hand count, and how many distinct phrasings the pattern took. A pattern that fires in one phrasing is a phrase to ban, and a rule needs several.
      placeholder: "164 quantifiers in 6,841 messages, across 9 distinct forms ('several', 'many', 'some', ...)."
    validations:
      required: true

  - type: textarea
    id: pair
    attributes:
      label: A before/after pair
      description: One real sentence that breaks the rule, and the same sentence rewritten to follow it. Replace names and paths with stand-ins.
      placeholder: |
        Before: Several worktrees are stale.
        After: 4 of the 7 worktrees are stale.
    validations:
      required: true

  - type: dropdown
    id: overlap
    attributes:
      label: Does an existing rule already cover part of this?
      description: Rules 1 to 11 in rules/writing.md. Name the rule in the evidence field if the answer is yes.
      options:
        - "No"
        - "Yes, partly"
        - "Not sure"
    validations:
      required: true
